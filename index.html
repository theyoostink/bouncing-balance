<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bouncing Balance</title>
	<style type="text/css">
		body {
			background-color: black;
		}
		h1 {
			color: #D3E3DD;
			font-family: sans-serif;
			text-align: center;
		}
		#defaultCanvas0 {
			margin: 0 auto;
			display: block;
			border: 1px black solid;
		}
		#score {
			margin-top: 10px;
			color: #D3E3DD;
			text-align: center;
			font-weight: bold;
		}
		#credit {
			margin-top: 40px;
			color: #D3E3DD;
			text-align: center;
		}
	</style>
</head>
<body>
<h1>Bouncing Balance</h1>
<div id="canvas"></div>
<div id="score"></div>
<div id="credit">Inspired by <a href="https://github.com/vnglst/pong-wars">https://github.com/vnglst/pong-wars</a></div>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/p5.collide2d"></script>
<script type="text/javascript">

var circleDiameter = 30;
var circleSpeed = 10;

var boardSize = 600;
var blockSize = 30;

var circle1 = {
	"x": 0,
	"y": 0,
	"dx": 0,
	"dy": 0,
	"diameter": circleDiameter
};

var circle2 = {
	"x": 400,
	"y": 300,
	"dx": 0,
	"dy": 0,
	"diameter": circleDiameter
};

var board = [];
for (var i = 0; i < boardSize / blockSize; i += 1) {
	board[i] = [];
	for (var j = 0; j < boardSize / blockSize; j += 1) {
		var block = {
			"color": i < boardSize / blockSize / 2 ? 0 : 1
		}
		board[i].push(block);
	}
}

var colors;

function setup() {
	var canvas = createCanvas(600, 600);
	canvas.parent("canvas");
	background(255);
	noStroke();

	circle1.x = random(circleDiameter, boardSize / 2 - circleDiameter);
	circle1.y = random(circleDiameter, boardSize - circleDiameter);

	circle1.dx = circleSpeed;
	circle1.dy = circleSpeed;

	circle2.x = random(boardSize / 2 + circleDiameter, boardSize - circleDiameter);
	circle2.y = random(circleDiameter, boardSize - circleDiameter);

	circle2.dx = -1 * circleSpeed;
	circle2.dy = -1 * circleSpeed;

	colors = [color(211, 227, 221), color(16, 65, 79)]
}

function draw() {
	background(255);

	for (var i = 0; i < board.length; i += 1) {
		for (var j = 0; j < board[i].length; j+= 1) {
			if (board[i][j].color == 0) {
				fill(colors[0]);
			}
			else {
				fill(colors[1]);
			}
			rect(i * blockSize, j * blockSize, blockSize, blockSize);
		}
	}

	fill(colors[1]);
	circle(circle1.x, circle1.y, circle1.diameter);
	fill(colors[0]);
	circle(circle2.x, circle2.y, circle2.diameter);

	checkCollisions();

	circle1.x += circle1.dx;
	circle1.y += circle1.dy;
	circle2.x += circle2.dx;
	circle2.y += circle2.dy;

	updateScore();
}

function checkCollisions() {
	for (var i = 0; i < board.length; i += 1) {
		for (var j = 0; j < board[i].length; j+= 1) {
			isCircle1Hit = collideRectCircle(i * blockSize, j * blockSize, blockSize, blockSize, circle1.x, circle1.y, circleDiameter);

			if (isCircle1Hit && board[i][j].color == 1) {
				var circle1PreviousY = circle1.y - circle1.dy;

				if (circle1PreviousY < j * blockSize || circle1PreviousY > j * blockSize + blockSize) {
					circle1.dy *= -1;
					circle1.y += circle1.dy;
				}
				else {
					circle1.dx *= -1;
					circle1.x += circle1.dx;
				}

				board[i][j].color = 1 - board[i][j].color;
			}

			isCircle2Hit = collideRectCircle(i * blockSize, j * blockSize, blockSize, blockSize, circle2.x, circle2.y, circleDiameter);

			if (isCircle2Hit && board[i][j].color == 0) {
				var circle2PreviousY = circle2.y - circle2.dy;

				if (circle2PreviousY < j * blockSize || circle2PreviousY > j * blockSize + blockSize) {
					circle2.dy *= -1;
					circle2.y += circle2.dy;
				}
				else {
					circle2.dx *= -1;
					circle2.x += circle2.dx;
				}
				
				board[i][j].color = 1 - board[i][j].color;
			}
		}
	}

	if (circle1.x > boardSize - circle1.diameter/2 || circle1.x < circle1.diameter/2) {
		circle1.dx *= -1;
	}
	if (circle1.y > boardSize - circle1.diameter/2 || circle1.y < circle1.diameter/2) {
		circle1.dy *= -1;
	}

	if (circle2.x > boardSize - circle2.diameter/2 || circle2.x < circle2.diameter/2) {
		circle2.dx *= -1;
	}
	if (circle2.y > boardSize - circle2.diameter/2 || circle2.y < circle2.diameter/2) {
		circle2.dy *= -1;
	}
}

function updateScore() {
	var circle1Score = 0;
	var circle2Score = 0;

	for (var i = 0; i < board.length; i += 1) {
		for (var j = 0; j < board[i].length; j+= 1) {
			if (board[i][j].color == 0) {
				circle1Score += 1;
			}
			else {
				circle2Score += 1;
			}
		}
	}

	document.getElementById("score").textContent = "Light Squares " + circle1Score + " | Dark Squares " + circle2Score
}

function mouseClicked(event) {
  if (mouseX >= 0 && mouseX <= boardSize && mouseY >= 0 && mouseY <= boardSize) {
  	board[Math.floor(mouseX / blockSize)][Math.floor(mouseY / blockSize)].color = 1 - board[Math.floor(mouseX / blockSize)][Math.floor(mouseY / blockSize)].color;
  }
}

</script>
</body>
</html>
